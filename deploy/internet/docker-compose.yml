# Internet hub: SpirChat hub behind Caddy, which obtains and renews the HTTPS certificate.
#   DOMAIN=hub.example.org docker compose up -d --build
services:
  hub:
    build:
      context: ../..
      args:
        VITE_INTERNET_HUBS: https://${DOMAIN}
    restart: unless-stopped
    environment:
      HUB_NAME: ${HUB_NAME:-SpirChat Internet}
      PEERS: ${PEERS:-}
      ALERT_KEYS: ${ALERT_KEYS:-}
      MAX_STORE_MB: ${MAX_STORE_MB:-8192}
      TRUST_PROXY: "1"
    volumes:
      - hubdata:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [hub]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to your domain name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  hubdata:
  caddydata:
